:root{
  --red:#CC0000;
  --red-dark:#990000;
  --red-deep:#7E0000;
  --black:#000000;
  --white:#FFFFFF;
  --gray:#4D4D4D;
  --panel:720px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;
  font-family:'Roboto',Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}

#scaler{position:absolute;top:0;left:0;transform-origin:top left}
#stage{position:relative;width:1920px;height:1080px;background:var(--red);overflow:hidden;
  display:flex;flex-direction:column}

.body{flex:1;display:flex;min-height:0}

/* ---------- photo stage ---------- */
.photos{position:relative;flex:1;overflow:hidden;background:#1a1a1a}
.photo{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;will-change:transform,opacity}
.photo.on{opacity:1;transition:opacity 1.8s ease-in-out}
.photo.pan{animation:kenburns 28s ease-in-out infinite alternate}
.photo.pan-b{animation:kenburns2 28s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1.04) translate3d(0,0,0)}
                    to{transform:scale(1.14) translate3d(-2%,-1.2%,0)}}
@keyframes kenburns2{from{transform:scale(1.13) translate3d(1.6%,1%,0)}
                     to{transform:scale(1.03) translate3d(0,0,0)}}

.photo-veil{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.15) 38%,rgba(0,0,0,0) 60%)}

/* one giant rotating line over the photo, nothing else */
.rotator{position:absolute;left:64px;right:80px;bottom:150px}
.rot-frame{position:relative;height:260px;display:flex;align-items:flex-end}
.rot-item{position:absolute;left:0;bottom:0;width:100%;color:#fff;font-weight:900;
  font-size:150px;line-height:.95;letter-spacing:-.03em;text-transform:uppercase;
  font-family:'Roboto Condensed',Roboto,Arial,sans-serif;
  text-shadow:0 6px 34px rgba(0,0,0,.9);opacity:0;transform:translateY(46px)}
.rot-item.in{animation:rotIn .8s cubic-bezier(.16,1,.3,1) forwards}
.rot-item.out{animation:rotOut .55s cubic-bezier(.6,0,.8,0) forwards}
@keyframes rotIn{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:translateY(0)}}
@keyframes rotOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
.rot-rule{width:150px;height:12px;background:var(--red);margin-top:30px;
  animation:growIn 1s .5s both cubic-bezier(.16,1,.3,1);transform-origin:left}
@keyframes growIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.hosts{position:absolute;left:64px;bottom:52px;right:80px;color:rgba(255,255,255,.85);
  font-size:22px;font-weight:400;line-height:1.35;text-shadow:0 2px 10px rgba(0,0,0,.9)}

/* ---------- red info panel ---------- */
.panel{flex:0 0 var(--panel);background:var(--red);color:#fff;padding:64px 60px 56px;
  display:flex;flex-direction:column}

.lockup{animation:riseIn .9s .05s both cubic-bezier(.16,1,.3,1)}
.lockup .pop{font-weight:900;font-size:172px;line-height:.84;letter-spacing:-.05em;color:#fff}
.lockup .back{font-weight:900;font-size:172px;line-height:.92;letter-spacing:-.05em;color:#fff;
  white-space:nowrap}
.lockup .yr{color:var(--black)}
.lockup .rule{width:100%;height:12px;background:#fff;margin-top:34px;
  transform-origin:left;animation:growIn 1.1s .35s both cubic-bezier(.16,1,.3,1)}

/* countdown */
.count-wrap{margin-top:52px;animation:riseIn .9s .4s both cubic-bezier(.16,1,.3,1)}
.count{display:flex;gap:18px}
.unit{flex:1;background:var(--red-dark);padding:22px 6px 18px;text-align:center}
.unit .n{font-weight:900;font-size:96px;line-height:1;color:#fff;
  font-variant-numeric:tabular-nums;display:block}
.unit .n.tick{animation:tick .45s cubic-bezier(.16,1,.3,1)}
@keyframes tick{0%{transform:translateY(-14px);opacity:.25}60%{transform:translateY(2px);opacity:1}
                100%{transform:translateY(0)}}
.unit .u{display:block;margin-top:10px;font-weight:700;font-size:18px;letter-spacing:.2em;
  text-transform:uppercase;color:#fff;opacity:.85}

/* live + after states */
.state-msg{margin-top:52px;animation:riseIn .9s .4s both cubic-bezier(.16,1,.3,1)}
.state-msg .flag{display:inline-flex;align-items:center;gap:16px;background:#fff;color:var(--red);
  font-weight:900;font-size:34px;letter-spacing:.04em;padding:16px 30px;text-transform:uppercase}
.dot{width:18px;height:18px;border-radius:50%;background:var(--red);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.state-msg .sub{margin-top:26px;font-weight:900;font-size:52px;color:#fff;line-height:1.1}

/* details: one bold block */
.details{margin-top:auto;animation:riseIn .9s .55s both cubic-bezier(.16,1,.3,1)}
.dline{font-family:'Roboto Condensed',Roboto,Arial,sans-serif;font-weight:700;font-size:52px;
  line-height:1.18;color:#fff}
.dline b{font-weight:700;color:#fff}

.cta{margin-top:38px;display:flex;align-items:center;gap:28px;
  animation:riseIn .9s .7s both cubic-bezier(.16,1,.3,1)}
.qr{width:190px;height:190px;flex:0 0 190px;background:#fff;padding:8px}
.qr img{width:100%;height:100%;display:block}
.cta-text .link{font-family:'Roboto Condensed',Roboto,Arial,sans-serif;font-weight:700;font-size:44px;
  color:#fff;line-height:1.05;white-space:nowrap}
.cta-text .tag{margin-top:12px;font-weight:900;font-size:34px;color:var(--black);letter-spacing:.01em}

@keyframes riseIn{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:translateY(0)}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .photo.on{transition:none}
}
</style>

<script>
(function(){
  'use strict';

  var P = new URLSearchParams(location.search);

  // Event window, America/New_York, stated as fixed offsets so the kiosk clock
  // does not need to be in Eastern time for the countdown to be right.
  var START = Date.parse('2026-08-27T16:00:00-04:00');
  var END   = Date.parse('2026-08-27T20:00:00-04:00');

  var nowOverride = P.get('now') ? Date.parse(P.get('now')) : null;
  var t0 = Date.now();
  function now(){ return nowOverride !== null ? nowOverride + (Date.now() - t0) : Date.now(); }

  /* ---------- scale 1920x1080 to fit whatever the display gives us ---------- */
  var scaler = document.getElementById('scaler');
  function fit(){
    var s = Math.min(innerWidth/1920, innerHeight/1080);
    scaler.style.transform = 'translate(' + ((innerWidth - 1920*s)/2) + 'px,' +
                             ((innerHeight - 1080*s)/2) + 'px) scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();

  /* ---------- photo crossfade ---------- */
  var photos = [document.getElementById('ph0'), document.getElementById('ph1')];
  var pi = 0;
  setInterval(function(){
    photos[pi].classList.remove('on');
    pi = (pi + 1) % photos.length;
    photos[pi].classList.add('on');
  }, 12000);

  /* ---------- rotating attraction line ---------- */
  var ATTRACTIONS = [
    'Free food',
    'Live music',
    'Mechanical bull',
    'Dunk tank',
    'Rock wall',
    'Games and giveaways'
  ];
  var rotFrame = document.getElementById('rotFrame');
  var ri = -1, current = null, rotOn = false, rotPinned = null;
  var rotateMs = Math.max(2, parseFloat(P.get('rotate') || '5')) * 1000;

  function showLine(text){
    if (current){
      var old = current;
      old.classList.remove('in'); old.classList.add('out');
      setTimeout(function(){ if (old.parentNode) old.parentNode.removeChild(old); }, 570);
    }
    var el = document.createElement('div');
    el.className = 'rot-item in';
    el.textContent = text;
    rotFrame.appendChild(el);
    current = el;
  }

  function setRotator(on, text){
    if (on){
      if (!rotOn){ rotOn = true; nextAttraction(); }
      return;
    }
    if (!rotOn && rotPinned === text) return;
    rotOn = false; rotPinned = text;
    showLine(text);
  }

  function nextAttraction(){
    if (!rotOn) return;
    ri = (ri + 1) % ATTRACTIONS.length;
    showLine(ATTRACTIONS[ri]);
  }
  setInterval(nextAttraction, rotateMs);

  /* ---------- state machine + countdown ---------- */
  var countWrap = document.getElementById('countWrap');
  var stateMsg  = document.getElementById('stateMsg');
  var flagTxt   = document.getElementById('flagTxt');
  var flagDot   = document.getElementById('flagDot');
  var stateSub  = document.getElementById('stateSub');
  var details   = document.getElementById('details');
  var cells     = { d:document.getElementById('cd'), h:document.getElementById('ch'),
                    m:document.getElementById('cm'), s:document.getElementById('cs') };
  var last      = {};

  function pad(n){ return (n < 10 ? '0' : '') + n; }

  function setCell(key, val){
    var el = cells[key];
    if (last[key] === val) return;
    last[key] = val;
    el.textContent = val;
    el.classList.remove('tick');
    void el.offsetWidth;
    el.classList.add('tick');
  }

  function forced(){ return P.get('preview'); }

  function render(){
    var t = now();
    var state = forced() ||
      (t < START ? 'countdown' : (t < END ? 'live' : 'after'));

    if (state === 'countdown'){
      countWrap.style.display = '';
      stateMsg.style.display  = 'none';
      details.style.display   = '';
      var ms = Math.max(0, (forced() ? START - 1 : START) - t);
      var s = Math.floor(ms/1000);
      setCell('d', pad(Math.floor(s/86400)));
      setCell('h', pad(Math.floor(s/3600) % 24));
      setCell('m', pad(Math.floor(s/60) % 60));
      setCell('s', pad(s % 60));
      setRotator(true);
    }

    else if (state === 'live'){
      countWrap.style.display = 'none';
      stateMsg.style.display  = '';
      details.style.display   = '';
      flagTxt.textContent = 'Happening now';
      flagDot.style.display = '';
      details.style.display = 'none';
      var left = Math.max(0, END - t);
      var hrs = Math.floor(left/3600000), mins = Math.floor(left/60000) % 60;
      stateSub.textContent = 'Join us on the Oval until 8 p.m. ' +
        (hrs > 0 ? hrs + (hrs === 1 ? ' hour ' : ' hours ') : '') + mins +
        (mins === 1 ? ' minute' : ' minutes') + ' left.';
      setRotator(true);
    }

    else {
      countWrap.style.display = 'none';
      stateMsg.style.display  = '';
      details.style.display   = 'none';
      flagTxt.textContent = 'See you next year';
      flagDot.style.display = 'none';
      stateSub.textContent = 'Thanks for packing the Oval, Wolfpack.';
      setRotator(false, 'That is a wrap');
    }
  }

  render();
  setInterval(render, 250);
})();
</script>
