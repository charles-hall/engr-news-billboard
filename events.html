<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NC State Events Slide</title>
<meta name="viewport" content="width=1920, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Digital signage slide showing upcoming events on NC State University's Centennial Campus.">

<link rel="preload" href="assets/fonts/roboto-condensed-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/slide.css">
<link rel="stylesheet" href="assets/events.css">
</head>
<body>

<div id="stage" class="stage ev-stage" aria-live="polite">

  <div class="rule-top" aria-hidden="true"></div>

  <header class="ev-header">
    <div>
      <p id="evEyebrow" class="ev-eyebrow">NC State University</p>
      <h1 id="evTitle" class="ev-title">Upcoming on Centennial Campus</h1>
    </div>
    <p id="evWindow" class="ev-window"></p>
  </header>

  <div id="evList" class="ev-list"><!-- rows injected here --></div>

  <footer class="footer">
    <div class="footer-inner">
      <span class="footer-source">More at calendar.ncsu.edu</span>
      <span id="evCount" class="footer-source"></span>
    </div>
  </footer>

</div>

<template id="evRowTemplate">
  <article class="ev-row">
    <div class="ev-chip">
      <span class="ev-chip-month"></span>
      <span class="ev-chip-day"></span>
    </div>
    <div class="ev-body">
      <h2 class="ev-name"></h2>
      <p class="ev-meta"></p>
    </div>
    <p class="ev-type"></p>
  </article>
</template>

<script src="assets/events.js"></script>
</body>
</html>
