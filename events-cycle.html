<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NC State Events Slide (Cycling)</title>
<meta name="viewport" content="width=1920, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Digital signage slide cycling through upcoming events on NC State University's Centennial Campus, one at a time with a featured photo and description.">

<link rel="preload" href="assets/fonts/roboto-condensed-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<!-- Reuses the news slide's stage/media/panel styling as-is: same canvas,
     same crossfade and Ken Burns treatment, same footer and dot pattern.
     Nothing here is events-specific, so no separate stylesheet is needed. -->
<link rel="stylesheet" href="assets/slide.css">
</head>
<body>

<div id="stage" class="stage" aria-live="polite">

  <div class="rule-top" aria-hidden="true"></div>

  <div id="deck" class="deck"><!-- slides injected here --></div>

  <footer class="footer">
    <div id="progress" class="progress" aria-hidden="true"></div>
    <div class="footer-inner">
      <span id="footerSource" class="footer-source">More at calendar.ncsu.edu</span>
      <nav id="dots" class="dots" aria-label="Event position"></nav>
    </div>
  </footer>

</div>

<template id="slideTemplate">
  <article class="slide">
    <div class="media">
      <img class="media-img" alt="" decoding="async">
      <div class="media-fallback" aria-hidden="true"><span>NC State</span></div>
    </div>
    <div class="panel">
      <div class="panel-inner">
        <span class="accent" aria-hidden="true"></span>
        <p class="eyebrow"></p>
        <h1 class="headline"></h1>
        <p class="date"></p>
        <p class="abstract"></p>
      </div>
    </div>
  </article>
</template>

<script src="assets/events-cycle.js"></script>
</body>
</html>
